name: Release

on:
  push:
    tags:
      - 'v*'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build-and-release:
    name: Build & Release Multi-Format Packages
    runs-on: ubuntu-22.04

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Install Rust toolchain
        uses: dtolnay/rust-toolchain@stable

      - name: Cache Rust dependencies
        uses: Swatinem/rust-cache@v2

      - name: Install system build dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y \
            pkg-config \
            meson \
            ninja-build \
            wayland-protocols \
            libwayland-dev \
            libgtk-4-dev \
            libxkbcommon-dev \
            librsvg2-dev \
            libvulkan-dev \
            gobject-introspection \
            valac \
            wget \
            file

      - name: Build & Install gtk4-layer-shell
        run: |
          git clone --depth=1 https://github.com/wmww/gtk4-layer-shell.git /tmp/gtk4-layer-shell
          cd /tmp/gtk4-layer-shell
          meson setup build --prefix=/usr -Dexamples=false
          ninja -C build
          sudo ninja -C build install
          sudo ldconfig

      - name: Build release binaries
        run: cargo build --release

      - name: Package Portable Tarball (.tar.gz)
        run: |
          VERSION="${GITHUB_REF_NAME:-v0.1.0}"
          PKG_NAME="mewtion-${VERSION}-linux-x86_64"
          mkdir -p "dist/${PKG_NAME}/bin"
          mkdir -p "dist/${PKG_NAME}/lib"
          mkdir -p "dist/${PKG_NAME}/assets"

          # Copy compiled binaries
          cp target/release/Mewtion "dist/${PKG_NAME}/bin/"
          cp target/release/control_panel "dist/${PKG_NAME}/bin/"

          # Bundle gtk4-layer-shell shared library
          cp -d /usr/lib/libgtk4-layer-shell.so* "dist/${PKG_NAME}/lib/" 2>/dev/null || \
          cp -d /usr/lib/x86_64-linux-gnu/libgtk4-layer-shell.so* "dist/${PKG_NAME}/lib/" 2>/dev/null || \
          cp -d /usr/local/lib/libgtk4-layer-shell.so* "dist/${PKG_NAME}/lib/" 2>/dev/null || true

          # Copy configs, docs, launcher, and assets
          cp mewtion_config.txt "dist/${PKG_NAME}/"
          cp LICENSE "dist/${PKG_NAME}/"
          cp README.md "dist/${PKG_NAME}/"
          cp start.sh "dist/${PKG_NAME}/"
          cp assets/* "dist/${PKG_NAME}/assets/" 2>/dev/null || true

          chmod +x "dist/${PKG_NAME}/start.sh" "dist/${PKG_NAME}/bin/"*

          tar -czvf "${PKG_NAME}.tar.gz" -C dist "${PKG_NAME}"

      - name: Package Debian (.deb)
        run: |
          RAW_VER="${GITHUB_REF_NAME:-0.1.0}"
          DEB_VER="${RAW_VER#v}"
          DEB_DIR="deb_pkg/mewtion_${DEB_VER}_amd64"

          mkdir -p "${DEB_DIR}/DEBIAN"
          mkdir -p "${DEB_DIR}/usr/bin"
          mkdir -p "${DEB_DIR}/usr/lib/mewtion"
          mkdir -p "${DEB_DIR}/usr/share/applications"
          mkdir -p "${DEB_DIR}/usr/share/icons/hicolor/scalable/apps"
          mkdir -p "${DEB_DIR}/usr/share/doc/mewtion"
          mkdir -p "${DEB_DIR}/etc/mewtion"

          # Generate Debian control file from template
          sed "s/__VERSION__/${DEB_VER}/g" assets/debian-control.template > "${DEB_DIR}/DEBIAN/control"
          chmod 755 "${DEB_DIR}/DEBIAN"
          chmod 644 "${DEB_DIR}/DEBIAN/control"

          # Binaries & bundled libraries
          cp target/release/Mewtion "${DEB_DIR}/usr/lib/mewtion/"
          cp target/release/control_panel "${DEB_DIR}/usr/lib/mewtion/"
          cp -d /usr/lib/libgtk4-layer-shell.so* "${DEB_DIR}/usr/lib/mewtion/" 2>/dev/null || \
          cp -d /usr/lib/x86_64-linux-gnu/libgtk4-layer-shell.so* "${DEB_DIR}/usr/lib/mewtion/" 2>/dev/null || \
          cp -d /usr/local/lib/libgtk4-layer-shell.so* "${DEB_DIR}/usr/lib/mewtion/" 2>/dev/null || true

          # System-wide launcher script
          cp assets/mewtion-launcher.sh "${DEB_DIR}/usr/bin/mewtion"
          chmod 755 "${DEB_DIR}/usr/bin/mewtion"
          chmod 755 "${DEB_DIR}/usr/lib/mewtion/Mewtion" "${DEB_DIR}/usr/lib/mewtion/control_panel"

          # Desktop entry, icon, and docs
          cp assets/dev.mewtion.Overlay.desktop "${DEB_DIR}/usr/share/applications/"
          cp assets/dev.mewtion.Overlay.svg "${DEB_DIR}/usr/share/icons/hicolor/scalable/apps/"
          cp mewtion_config.txt "${DEB_DIR}/etc/mewtion/"
          cp README.md "${DEB_DIR}/usr/share/doc/mewtion/"
          cp LICENSE "${DEB_DIR}/usr/share/doc/mewtion/copyright"

          # Build Debian package
          dpkg-deb --build --root-owner-group "${DEB_DIR}" "mewtion_${DEB_VER}_amd64.deb"

      - name: Package Universal AppImage (.AppImage)
        run: |
          VERSION="${GITHUB_REF_NAME:-v0.1.0}"
          APPDIR="AppDir"
          mkdir -p "${APPDIR}/usr/bin"
          mkdir -p "${APPDIR}/usr/lib"
          mkdir -p "${APPDIR}/usr/share/icons/hicolor/scalable/apps"

          # Copy binaries and bundled libraries
          cp target/release/Mewtion "${APPDIR}/usr/bin/"
          cp target/release/control_panel "${APPDIR}/usr/bin/"
          cp -d /usr/lib/libgtk4-layer-shell.so* "${APPDIR}/usr/lib/" 2>/dev/null || \
          cp -d /usr/lib/x86_64-linux-gnu/libgtk4-layer-shell.so* "${APPDIR}/usr/lib/" 2>/dev/null || \
          cp -d /usr/local/lib/libgtk4-layer-shell.so* "${APPDIR}/usr/lib/" 2>/dev/null || true

          # Desktop file and Icon
          cp assets/dev.mewtion.Overlay.desktop "${APPDIR}/"
          cp assets/dev.mewtion.Overlay.svg "${APPDIR}/"
          cp assets/dev.mewtion.Overlay.svg "${APPDIR}/.DirIcon"
          cp assets/dev.mewtion.Overlay.svg "${APPDIR}/usr/share/icons/hicolor/scalable/apps/"
          cp mewtion_config.txt "${APPDIR}/"

          # AppRun launcher script
          cp assets/AppRun "${APPDIR}/AppRun"
          chmod +x "${APPDIR}/AppRun" "${APPDIR}/usr/bin/"*

          # Extract appimagetool to bypass runner FUSE restrictions
          wget -q https://github.com/AppImage/appimagetool/releases/download/continuous/appimagetool-x86_64.AppImage -O /tmp/appimagetool.AppImage
          chmod +x /tmp/appimagetool.AppImage
          /tmp/appimagetool.AppImage --appimage-extract
          ARCH=x86_64 ./squashfs-root/AppRun "${APPDIR}" "Mewtion-${VERSION}-x86_64.AppImage"

      - name: Upload artifacts for workflow runs
        uses: actions/upload-artifact@v4
        with:
          name: mewtion-packages
          path: |
            mewtion-*.tar.gz
            mewtion_*.deb
            Mewtion-*.AppImage

      - name: Publish GitHub Release
        uses: softprops/action-gh-release@v2
        if: startsWith(github.ref, 'refs/tags/')
        with:
          files: |
            mewtion-*.tar.gz
            mewtion_*.deb
            Mewtion-*.AppImage
          name: Mewtion ${{ github.ref_name }}
          generate_release_notes: true
          draft: false
          prerelease: false
