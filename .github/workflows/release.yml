name: Release

on:
  push:
    tags:
      - 'v*'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build-and-release:
    name: Build & Release Linux x86_64
    runs-on: ubuntu-22.04

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Install Rust toolchain
        uses: dtolnay/rust-toolchain@stable

      - name: Cache Rust dependencies
        uses: Swatinem/rust-cache@v2

      - name: Install system dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y \
            pkg-config \
            meson \
            ninja-build \
            wayland-protocols \
            libwayland-dev \
            libgtk-4-dev \
            libxkbcommon-dev \
            librsvg2-dev \
            libvulkan-dev \
            gobject-introspection

      - name: Build & Install gtk4-layer-shell
        run: |
          git clone --depth=1 https://github.com/wmww/gtk4-layer-shell.git /tmp/gtk4-layer-shell
          cd /tmp/gtk4-layer-shell
          meson setup build --prefix=/usr -Dexamples=false
          ninja -C build
          sudo ninja -C build install
          sudo ldconfig

      - name: Build release binaries
        run: cargo build --release

      - name: Assemble Release Package
        run: |
          VERSION="${GITHUB_REF_NAME:-v0.1.0}"
          PKG_NAME="mewtion-${VERSION}-linux-x86_64"
          mkdir -p "dist/${PKG_NAME}/bin"
          mkdir -p "dist/${PKG_NAME}/lib"

          # Copy compiled binaries
          cp target/release/Mewtion "dist/${PKG_NAME}/bin/"
          cp target/release/control_panel "dist/${PKG_NAME}/bin/"

          # Bundle gtk4-layer-shell shared library for end-users
          cp -d /usr/lib/libgtk4-layer-shell.so* "dist/${PKG_NAME}/lib/" 2>/dev/null || \
          cp -d /usr/lib/x86_64-linux-gnu/libgtk4-layer-shell.so* "dist/${PKG_NAME}/lib/" 2>/dev/null || \
          cp -d /usr/local/lib/libgtk4-layer-shell.so* "dist/${PKG_NAME}/lib/" 2>/dev/null || true

          # Copy configs, docs, and launcher
          cp mewtion_config.txt "dist/${PKG_NAME}/"
          cp LICENSE "dist/${PKG_NAME}/"
          cp README.md "dist/${PKG_NAME}/"
          cp start.sh "dist/${PKG_NAME}/"

          chmod +x "dist/${PKG_NAME}/start.sh" "dist/${PKG_NAME}/bin/"*

          # Create compressed archive
          tar -czvf "${PKG_NAME}.tar.gz" -C dist "${PKG_NAME}"
          echo "ARCHIVE_NAME=${PKG_NAME}.tar.gz" >> $GITHUB_ENV

      - name: Upload artifact for manual workflow runs
        uses: actions/upload-artifact@v4
        with:
          name: ${{ env.ARCHIVE_NAME }}
          path: ${{ env.ARCHIVE_NAME }}

      - name: Publish GitHub Release
        uses: softprops/action-gh-release@v2
        if: startsWith(github.ref, 'refs/tags/')
        with:
          files: ${{ env.ARCHIVE_NAME }}
          name: Mewtion ${{ github.ref_name }}
          generate_release_notes: true
          draft: false
          prerelease: false
