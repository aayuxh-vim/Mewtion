<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 256 256" width="256" height="256">
  <defs>
    <linearGradient id="bg" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#1e1e24"/>
      <stop offset="100%" stop-color="#121216"/>
    </linearGradient>
    <radialGradient id="glow" cx="50%" cy="50%" r="50%">
      <stop offset="0%" stop-color="#38bdf8" stop-opacity="1"/>
      <stop offset="100%" stop-color="#38bdf8" stop-opacity="0"/>
    </radialGradient>
  </defs>

  <!-- App Icon Background -->
  <rect width="256" height="256" rx="56" fill="url(#bg)"/>
  <rect x="1.5" y="1.5" width="253" height="253" rx="54.5" fill="none" stroke="#2e2e38" stroke-width="3"/>

  <!-- Screen Outline -->
  <rect x="44" y="52" width="168" height="152" rx="16" fill="none" stroke="#475569" stroke-width="4" stroke-dasharray="8 6"/>

  <!-- Motion Cues Dots along the borders -->
  <!-- Top Edge -->
  <circle cx="76" cy="40" r="7" fill="#38bdf8"/>
  <circle cx="128" cy="38" r="8" fill="#60a5fa"/>
  <circle cx="180" cy="40" r="7" fill="#38bdf8"/>

  <!-- Bottom Edge -->
  <circle cx="76" cy="216" r="7" fill="#38bdf8"/>
  <circle cx="128" cy="218" r="8" fill="#60a5fa"/>
  <circle cx="180" cy="216" r="7" fill="#38bdf8"/>

  <!-- Left Edge -->
  <circle cx="32" cy="94" r="7" fill="#38bdf8"/>
  <circle cx="30" cy="128" r="8" fill="#60a5fa"/>
  <circle cx="32" cy="162" r="7" fill="#38bdf8"/>

  <!-- Right Edge -->
  <circle cx="224" cy="94" r="7" fill="#38bdf8"/>
  <circle cx="226" cy="128" r="8" fill="#60a5fa"/>
  <circle cx="224" cy="162" r="7" fill="#38bdf8"/>

  <!-- Center Vehicle Incline / Movement Arrow -->
  <path d="M128 104 L128 152 M128 104 L114 118 M128 104 L142 118" fill="none" stroke="#f8fafc" stroke-width="5" stroke-linecap="round" stroke-linejoin="round"/>
</svg>
